<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al torneo</title>
    <link rel="stylesheet" href="./css/main.css">
  </head>
  <body>
    <main>
      <h1>Inscripción al torneo</h1>
      <p>Rellena tus datos para participar. Los campos con * son obligatorios.</p>
      <form action="#" method="post">
        <fieldset>
          <legend>Datos del jugador</legend>
          <label for="nombre">Nombre completo *</label>
          <input type="text" id="nombre" name="nombre" required>
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" name="email" required>
          <label for="edad">Edad (mínimo 16 años)</label>
          <input type="number" id="edad" name="edad" min="16">
          <label for="nickname">Nickname (de 3 a 15 caracteres) *</label>
          <input type="text" id="nickname" name="nickname" minlength="3" maxlength="15" required>
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" required>
          <label for="nacimiento">Fecha de nacimiento</label>
          <input type="date" id="nacimiento" name="nacimiento">
        </fieldset>
        <fieldset>
          <legend>Datos del torneo</legend>
          <label for="juego">Videojuego</label>
          <select id="juego" name="juego">
            <option value="">Selecciona un juego</option>
            <option value="fortnite">Fortnite</option>
            <option value="rocket-league">Rocket League</option>
            <option value="fc">EA Sports FC</option>
          </select>
          <fieldset>
            <legend>Plataforma</legend>
            <label class="opcion" for="pc"><input type="radio" id="pc" name="plataforma" value="pc"> PC</label>
            <label class="opcion" for="playstation"><input type="radio" id="playstation" name="plataforma" value="playstation"> PlayStation</label>
            <label class="opcion" for="xbox"><input type="radio" id="xbox" name="plataforma" value="xbox"> Xbox</label>
          </fieldset>
          <fieldset>
            <legend>Disponibilidad horaria</legend>
            <label class="opcion" for="manana"><input type="checkbox" id="manana" name="horario" value="manana"> Mañana</label>
            <label class="opcion" for="tarde"><input type="checkbox" id="tarde" name="horario" value="tarde"> Tarde</label>
            <label class="opcion" for="noche"><input type="checkbox" id="noche" name="horario" value="noche"> Noche</label>
          </fieldset>
          <label for="comentarios">Comentarios adicionales</label>
          <textarea id="comentarios" name="comentarios" rows="4"></textarea>
        </fieldset>
        <p><input type="checkbox" id="normas" name="normas" value="aceptadas" required> <label class="opcion" for="normas">Acepto las <a href="tos.html">normas del torneo</a> *</label></p>
        <button type="submit">Inscribirme</button>
        <button type="reset">Limpiar formulario</button>
      </form>
    </main>
  </body>
</html>
